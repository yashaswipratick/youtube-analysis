spring:
  application:
    name: youtube-analytics
  # Unused H2 datasource is kept in-memory for legacy compatibility tests only.
  # Live application records and OAuth tokens are stored in Cassandra.
  datasource:
    url: jdbc:h2:mem:legacy-unused;DB_CLOSE_DELAY=-1
    username: ${CREATOR_DB_USERNAME:sa}
    password: ${CREATOR_DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/youtube.readonly
              # Required by Google's OAuth-protected captions.list/download endpoints.
              - https://www.googleapis.com/auth/youtube.force-ssl
              - https://www.googleapis.com/auth/yt-analytics.readonly
              # Required for estimated revenue and ad performance reports on monetized channels.
              - https://www.googleapis.com/auth/yt-analytics-monetary.readonly
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  # Override SERVER_PORT when deploying the API on a different port.
  port: ${SERVER_PORT:8080}

# Automatically open Google sign-in when running locally. Set OAUTH_AUTO_OPEN_BROWSER=false
# for headless servers or environments where a browser should not be launched.
app:
  storage:
    # Read-only source used to migrate existing rows from the previous H2 file at first startup.
    database-path: ${CREATOR_DB_PATH:./data/youtube-analytics/creator-coach-db}
    migrate-legacy-h2: ${CASSANDRA_MIGRATE_LEGACY_H2:true}
  cassandra:
    contact-point: ${CASSANDRA_CONTACT_POINT:127.0.0.1}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_LOCAL_DATACENTER:datacenter1}
  oauth:
    # Stable, independent key for encrypted OAuth token storage. If blank, the local-development
    # fallback derives a key from GOOGLE_CLIENT_SECRET. Set YOUTUBE_TOKEN_ENCRYPTION_KEY in deployments.
    token-encryption-key: ${YOUTUBE_TOKEN_ENCRYPTION_KEY:}
    auto-open-browser: ${OAUTH_AUTO_OPEN_BROWSER:true}
  ui:
    # Used only when login was started from the separate UI. Direct OAuth URL visits
    # finish at the backend's /api/youtube-analytics/v1/oauth/success response.
    base-url: ${UI_BASE_URL:http://localhost:3000}
  cors:
    # Comma-separated frontend origins allowed to call the backend with session cookies.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

youtube:
  oauth:
    credentials-file: ${YOUTUBE_OAUTH_CREDENTIALS_FILE:/Users/yashaswipratick/Documents/youtube-analytics/secrets.json}
  analytics:
    reporting-lag-days: ${YOUTUBE_ANALYTICS_REPORTING_LAG_DAYS:3}
    archive-directory: ${YOUTUBE_ANALYTICS_ARCHIVE_DIR:./data/youtube-analytics/reports}
    # Zero keeps every snapshot. Positive values prune expired snapshots for a video when that video is enriched.
    archive-retention-days: ${YOUTUBE_ANALYTICS_ARCHIVE_RETENTION_DAYS:0}
    metrics:
      core: views,engagedViews,estimatedMinutesWatched,averageViewDuration,averageViewPercentage,likes,dislikes,comments,shares,subscribersGained,subscribersLost,videosAddedToPlaylists,videosRemovedFromPlaylists
      cards: cardImpressions,cardClicks,cardClickRate,cardTeaserImpressions,cardTeaserClicks,cardTeaserClickRate
      premium: redViews,estimatedRedMinutesWatched
      retention: audienceWatchRatio,relativeRetentionPerformance
      demographics: viewerPercentage
      traffic: engagedViews,views,estimatedMinutesWatched
      trend: views,estimatedMinutesWatched,subscribersGained,shares,uniques
      revenue: estimatedRevenue,estimatedAdRevenue,estimatedRedPartnerRevenue,grossRevenue,cpm,playbackBasedCpm,monetizedPlaybacks,adImpressions
      optional: videoThumbnailImpressions,videoThumbnailImpressionsClickRate,endScreenElementImpressions,endScreenElementClicks,endScreenElementClickRate
      retention-events: startedWatching,stoppedWatching,totalSegmentImpressions
      livestream: averageConcurrentViewers,peakConcurrentViewers
      format: views,estimatedMinutesWatched,averageViewDuration,averageViewPercentage
      playlist: averageTimeInPlaylist,playlistAverageViewDuration,playlistEstimatedMinutesWatched,playlistSaves,playlistStarts,playlistViews,viewsPerPlaylistStart
      geography: engagedViews,views,estimatedMinutesWatched,averageViewDuration,averageViewPercentage

  reporting:
    metrics:
      reach: video_thumbnail_impressions,video_thumbnail_impressions_ctr
      reach-combined: video_thumbnail_impressions,video_thumbnail_impressions_ctr
      end-screens: end_screen_element_impressions,end_screen_element_clicks,end_screen_element_click_rate
openai:
  # Local development only. Never commit the key file itself.
  # Payload logging includes full transcript/analytics content; disable for shared or production logs.
  log-payloads: ${OPENAI_LOG_PAYLOADS:false}
  validate-on-startup: ${OPENAI_VALIDATE_ON_STARTUP:true}
  api-key-file: ${OPENAI_API_KEY_FILE:/Users/yashaswipratick/Desktop/OPEN_API_KEY.txt}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-5.6-luna}

# Optional local executable for public competitor captions. Install with `brew install yt-dlp` on macOS,
# or set YTDLP_COMMAND to an executable path. The app never runs this through a shell.
transcript:
  yt-dlp-command: ${YTDLP_COMMAND:yt-dlp}

creator-coach:
  daily-analysis-limit: ${CREATOR_COACH_DAILY_ANALYSIS_LIMIT:10}
  input-cost-per-million-usd: ${CREATOR_COACH_INPUT_COST_PER_MILLION_USD:0}
  output-cost-per-million-usd: ${CREATOR_COACH_OUTPUT_COST_PER_MILLION_USD:0}

logging:
  level:
    com.youtube.analytics: DEBUG
    org.springframework.security: WARN
    org.springframework.web.reactive: WARN
