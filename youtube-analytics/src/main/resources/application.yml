spring:
  application:
    name: youtube-analytics

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/youtube.readonly
              - https://www.googleapis.com/auth/yt-analytics.readonly
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: 8080

video-analysis:
  input-directory: /Users/yashaswipratick/Documents/short-drive/Kailashagiri-hills/

youtube:
  oauth:
    credentials-file: /Users/yashaswipratick/Documents/youtube-analytics/screts.json
  analytics:
    default-metrics: views,engagedViews,estimatedMinutesWatched,averageViewDuration,averageViewPercentage,likes,comments,shares,subscribersGained,subscribersLost

openai:
  # Local development only. Never commit the key file itself.
  api-key-file: ${OPENAI_API_KEY_FILE:/Users/yashaswipratick/Documents/OPEN_API_KEY.txt}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-5.6-luna}
  transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}

logging:
  level:
    com.youtube.analytics: DEBUG
    org.springframework.security: WARN
    org.springframework.web.reactive: WARN
